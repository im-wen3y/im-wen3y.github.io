<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SeriesBox</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Bungee&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap">
<style>html,body{margin:0} body{background:var(--bg-canvas)}</style>
</head>
<body class="w-root">
<div style="padding:20px 24px">
<section class="w-series" aria-label="시리즈">
  <span class="w-series__label">시리즈</span>
  <a href="#" class="w-series__name">로그인 상태를 서버에서 다루기</a>
  <ol class="w-series__list" id="series-list" hidden>
    <li><span class="w-series__no">1.</span><a href="#">초기 HTML에 로그인 상태를 넣기까지</a></li>
    <li><span class="w-series__no">2.</span><span aria-current="page">버그 세 개를 각각 쫓다가, 뿌리가 하나였다</span></li>
    <li><span class="w-series__no">3.</span><a href="#">캐시와 로그인 상태를 같이 맞추는 법</a></li>
  </ol>
  <div class="w-series__foot">
    <button type="button" class="w-series__toggle" aria-expanded="false" aria-controls="series-list"><span class="w-icon" aria-hidden="true">expand_more</span><span class="w-series__toggle-text">목록 보기</span></button>
    <div class="w-series__nav">
      <span class="w-series__pos">2/3</span>
      <a href="#" class="w-series__btn" aria-label="이전 글"><span class="w-icon" aria-hidden="true">chevron_left</span></a>
      <a href="#" class="w-series__btn" aria-label="다음 글"><span class="w-icon" aria-hidden="true">chevron_right</span></a>
    </div>
  </div>
</section>
</div>
<script>
  var btn = document.querySelector('.w-series__toggle');
  var list = document.getElementById('series-list');
  btn.addEventListener('click', function () {
    var open = btn.getAttribute('aria-expanded') === 'true';
    btn.setAttribute('aria-expanded', String(!open));
    list.hidden = open;
    btn.querySelector('.w-icon').textContent = open ? 'expand_more' : 'expand_less';
    btn.querySelector('.w-series__toggle-text').textContent = open ? '목록 보기' : '숨기기';
  });
</script>
</body>
</html>
