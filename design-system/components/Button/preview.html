<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Button</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Bungee&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap">
<style>html,body{margin:0} body{background:var(--bg-canvas)}</style>
</head>
<body class="w-root">
<div class="w-pv"><div class="w-pv__cell"><button type="button" class="w-btn w-btn--primary">글 둘러보기<span class="w-icon" aria-hidden="true">arrow_forward</span></button><span class="w-pv__cap">Primary · 기본</span></div><div class="w-pv__cell"><button type="button" class="w-btn w-btn--primary is-hover">글 둘러보기<span class="w-icon" aria-hidden="true">arrow_forward</span></button><span class="w-pv__cap">Primary · Hover [제안]</span></div><div class="w-pv__cell"><button type="button" class="w-btn w-btn--primary is-focus">글 둘러보기<span class="w-icon" aria-hidden="true">arrow_forward</span></button><span class="w-pv__cap">Primary · Focus [제안]</span></div><div class="w-pv__cell"><button type="button" class="w-btn w-btn--primary" disabled>글 둘러보기<span class="w-icon" aria-hidden="true">arrow_forward</span></button><span class="w-pv__cap">Disabled [제안]</span></div><div class="w-pv__cell"><a href="#" class="w-btn w-btn--secondary">모든 글 보기<span class="w-icon" aria-hidden="true">arrow_forward</span></a><span class="w-pv__cap">Secondary</span></div><div class="w-pv__cell"><button type="button" class="w-btn w-btn--small"><span class="w-icon" aria-hidden="true">link</span>링크 복사</button><span class="w-pv__cap">Small · 공유</span></div></div>
</body>
</html>
