<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>

<div class="window">
  <div class="titlebar">
    <span class="lights" aria-hidden="true"></span>
    <span class="titlebar-name">{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</span>
  </div>

  <div class="toolbar">
    <a class="home" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <span class="toolbar-desc">{{ site.description }}</span>
  </div>

  <main>
    {% if page.title and page.date %}
    <article>
      <h1>{{ page.title }}</h1>
      <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y년 %-m월 %-d일" }}</time></p>
      {{ content }}
      <p class="back"><a href="{{ '/' | relative_url }}">← 글 목록</a></p>
    </article>
    {% else %}
      {{ content }}
    {% endif %}
  </main>

  <footer>
    <a href="https://github.com/im-wen3y">github.com/im-wen3y</a>
  </footer>
</div>

</body>
</html>
