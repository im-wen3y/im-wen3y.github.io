<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<header class="site">
  <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <p class="site-desc">{{ site.description }}</p>
</header>

<main>
  {% if page.title and page.date %}
  <article>
    <h1>{{ page.title }}</h1>
    <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time></p>
    {{ content }}
  </article>
  {% else %}
    {{ content }}
  {% endif %}
</main>

<footer class="site">
  <a href="https://github.com/im-wen3y">github.com/im-wen3y</a>
</footer>
</body>
</html>
